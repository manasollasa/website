<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} — {{ site.tagline }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Brahmi&family=Noto+Sans+Devanagari&family=Noto+Sans+Kannada&family=Noto+Sans+Telugu&family=Noto+Sans+Tamil&family=Noto+Sans+Bengali&family=Noto+Sans+Gujarati&family=Noto+Sans+Malayalam&family=Noto+Sans+Oriya&family=Noto+Sans+Gurmukhi&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Grantha&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  {% if site.google_analytics != "" and jekyll.environment == "production" %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="#top" role="img" aria-label="Mānasollāsa Foundation">
        <svg class="bl" viewBox="0 0 210 20" width="210" height="20"><text x="0" y="15" textLength="200" lengthAdjust="spacing" font-family="Noto Sans Brahmi, serif" font-size="14" fill="#7d5411">𑀫𑀸𑀦𑀲𑁄𑀮𑁆𑀮𑀸𑀲</text></svg>
        <svg class="bl" viewBox="0 0 210 20" width="210" height="20"><text x="0" y="15" textLength="200" lengthAdjust="spacing" font-family="Noto Sans Brahmi, serif" font-size="14" fill="#7d5411">𑀧𑁆𑀭𑀢𑀺𑀱𑁆𑀞𑀸𑀦</text></svg>
        <svg class="bl" viewBox="0 0 210 30" width="210" height="30"><text x="0" y="25" textLength="200" lengthAdjust="spacing" font-family="Cormorant Garamond, Georgia, serif" font-weight="500" font-size="28" fill="#201f1d">Mānasollāsa</text></svg>
        <svg class="bl" viewBox="0 0 210 14" width="210" height="14"><text x="0" y="11" textLength="200" lengthAdjust="spacing" font-family="Cormorant Garamond, Georgia, serif" font-weight="600" font-size="11" fill="#444141">FOUNDATION</text></svg>
      </a>
      <nav class="nav">
        <a href="#projects">Projects</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span class="foot-brahmi">𑀫𑀸𑀦𑀲𑁄𑀮𑁆𑀮𑀸𑀲 𑀧𑁆𑀭𑀢𑀺𑀱𑁆𑀞𑀸𑀦</span>
      <small>© {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</small>
    </div>
  </footer>

  <script src="{{ '/assets/js/lockup.js' | relative_url }}"></script>
</body>
</html>
