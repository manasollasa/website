title: Mānasollāsa Foundation
tagline: The encyclopedic expanse of Indian thought
description: >-
  With reverence to the Chalukya monarch Someshwara, the Mānasollāsa Foundation
  is dedicated to the encyclopedic expanse of Indian thought — science, arts,
  history, polity, sport, and the everyday.

# Set to "/your-repo-name" if serving from a project page
# (https://username.github.io/your-repo-name). Leave empty for a user/org
# page or a custom domain.
baseurl: ""
url: ""

# Google Analytics (GA4) measurement ID, e.g. "G-XXXXXXXXXX". Leave blank to
# disable. Only loads when jekyll.environment is "production" — GitHub Pages
# builds are always production, so `bundle exec jekyll serve` locally stays
# untracked.
google_analytics: ""

# Collections drive the Projects and Events sections. output:false means the
# entries render inline on the one-pager rather than as separate pages.
collections:
  projects:
    output: false
  events:
    output: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

plugins:
  - jekyll-seo-tag
